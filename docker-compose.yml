services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lienradar
      POSTGRES_PASSWORD: lienradar
      POSTGRES_DB: lienradar
    ports:
      - "5432:5432"
    volumes:
      - lienradar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lienradar -d lienradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lienradar_redis:/data
    command: ["redis-server", "--save", "60", "1000", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lienradar_pg:
  lienradar_redis:
